# Resort OS production SSH policy.
# Installed as /etc/ssh/sshd_config.d/00-resort-os-hardening.conf.
#
# OpenSSH uses the first obtained value for each keyword. Ubuntu cloud-init
# ships 50-cloud-init.conf, so this policy must sort before it; a 99-* file
# would look authoritative but would not override PasswordAuthentication.
#
# Bootstrap order is important: create and verify the `resortos` key-only
# sudo account before installing this file.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitEmptyPasswords no

AllowUsers resortos
