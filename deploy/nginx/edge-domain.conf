# ─────────────────────────────────────────────────────────────────────────────
#  Resort OS (El Kheima Beach) — Domain-based TLS edge nginx
#
#  elkheima.com  / www.elkheima.com  → marketing_site  (الموقع الخارجي)
#  app.elkheima.com                  → el_kheima        (تطبيق الموظفين)
#
#  A single SAN certificate covers the apex, www, and app hosts. Keeping one
#  lineage makes renewal and rollback simpler than coordinating two certs.
#  SSL certificates managed by Certbot (Let's Encrypt).
#  Used with: docker-compose.prod.yml + docker-compose.prod.domain.yml
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect + ACME challenge لكل الـ subdomains
server {
    listen 80;
    server_name elkheima.com www.elkheima.com app.elkheima.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── elkheima.com + www → marketing_site (الموقع الخارجي) ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name elkheima.com www.elkheima.com;

    ssl_certificate     /etc/letsencrypt/live/elkheima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elkheima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResortPublicTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Start with a one-week canary. Raise this only after domain burn-in;
    # includeSubDomains is deliberately omitted until every subdomain is known.
    add_header Strict-Transport-Security "max-age=604800" always;

    resolver 127.0.0.11 valid=30s;
    set $marketing_upstream marketing_site:80;

    location / {
        proxy_pass http://$marketing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── app.elkheima.com → el_kheima (تطبيق الموظفين POS/KDS) ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.elkheima.com;

    ssl_certificate     /etc/letsencrypt/live/elkheima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elkheima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResortAppTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=604800" always;

    resolver 127.0.0.11 valid=30s;
    set $el_kheima_upstream el_kheima:80;

    location / {
        proxy_pass http://$el_kheima_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
