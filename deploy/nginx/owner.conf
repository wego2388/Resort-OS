# ─────────────────────────────────────────────────────────────────────────────
#  Resort OS — owner.elkheima.com  (Owner Intelligence Cockpit PWA)
#
#  Decision 0004: subdomain مستقل — cookie isolation، CSP منفصل.
#  هذا الملف يُدمج مع edge-domain.conf عبر include في nginx الرئيسي،
#  أو يُضاف كـ server block إضافي في docker-compose.prod.yml.
#
#  SSL: نفس شهادة elkheima.com (SAN) — تحتاج تجديد cert بعد إضافة subdomain.
#  الـ cert الحالي يغطي: elkheima.com، www.elkheima.com، app.elkheima.com
#  يجب إضافة: owner.elkheima.com للـ SAN قبل التفعيل.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name owner.elkheima.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── owner.elkheima.com → owner PWA ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name owner.elkheima.com;

    ssl_certificate     /etc/letsencrypt/live/elkheima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elkheima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResortOwnerTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — نفس المدة كـ app.elkheima.com (أسبوع canary)
    add_header Strict-Transport-Security "max-age=604800" always;

    # CSP مشددة — Decision 0004: لا external calls، لا AI، لا CDN
    # default-src 'self' فقط. script/style من نفس الـ origin.
    # connect-src يسمح فقط بـ /api/v1/owner/* على نفس الـ VPS.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://app.elkheima.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
        always;

    # منع تضمين الصفحة في iframe
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cookie isolation — SameSite=Strict على owner.elkheima.com
    # يمنع أي cross-app token reuse مع app.elkheima.com
    proxy_cookie_flags ~ SameSite=Strict;

    resolver 127.0.0.11 valid=30s;
    set $owner_upstream owner:80;

    # ── API calls → backend مباشرة ──────────────────────────────────────
    # owner app تتكلم مع /api/v1/owner/* على backend نفسه
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # Cache-Control: no-store على كل /api/v1/owner/* responses
        # (Backend يرسله بالفعل — nginx يؤكده كطبقة ثانية)
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    # ── PWA static assets ────────────────────────────────────────────────
    location / {
        proxy_pass http://$owner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # Service worker scope
        add_header Service-Worker-Allowed "/" always;
    }
}
