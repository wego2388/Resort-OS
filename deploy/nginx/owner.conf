# ─────────────────────────────────────────────────────────────────────────────
#  Resort OS — owner.elkheima.com  (Owner Intelligence Cockpit PWA)
#
#  Decision 0004: subdomain مستقل — cookie isolation، CSP منفصل.
#  هذا الملف يُضاف بجانب edge-domain.conf في docker-compose.prod.domain.yml.
#  تحويل HTTP وتحدي ACME لكل النطاقات (ومنها owner) مركزيان في
#  edge-domain.conf؛ هنا نعرّف مضيف Owner على HTTPS فقط لتفادي تكرار
#  server_name على المنفذ 80.
#
#  SSL: نفس شهادة elkheima.com (SAN)، وتشمل حاليًا elkheima.com وwww وapp
#  وowner؛ يتولى Certbot تجديد lineage الموحد.
# ─────────────────────────────────────────────────────────────────────────────

# ── owner.elkheima.com → owner PWA ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name owner.elkheima.com;

    ssl_certificate     /etc/letsencrypt/live/elkheima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elkheima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResortOwnerTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — نفس المدة كـ app.elkheima.com (أسبوع canary)
    add_header Strict-Transport-Security "max-age=604800" always;

    # CSP مشددة — Decision 0004: لا external calls، لا AI، لا CDN
    # default-src 'self' فقط. script/style من نفس الـ origin.
    # connect-src يسمح فقط بـ /api/v1/owner/* على نفس الـ VPS.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://app.elkheima.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
        always;

    # منع تضمين الصفحة في iframe
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cookie isolation — SameSite=Strict على owner.elkheima.com
    # يمنع أي cross-app token reuse مع app.elkheima.com
    proxy_cookie_flags ~ SameSite=Strict;

    resolver 127.0.0.11 valid=30s;
    set $owner_upstream owner:80;

    # ── API calls → backend ──────────────────────────────────────────────
    location /api/ {
        set $backend_upstream backend:8005;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # Cache-Control: no-store على كل /api/v1/owner/* responses
        # (Backend يرسله بالفعل — nginx يؤكده كطبقة ثانية)
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    # ── PWA static assets ────────────────────────────────────────────────
    location / {
        proxy_pass http://$owner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # Service worker scope
        add_header Service-Worker-Allowed "/" always;
    }
}
