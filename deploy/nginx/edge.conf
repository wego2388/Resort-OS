# ─────────────────────────────────────────────────────────────────────────────
#  Resort OS (El Kheima Beach) — public edge nginx
#
#  Mounted into the `nginx` service in docker-compose.prod.yml. Terminates
#  TLS and routes by subdomain to the matching frontend container.
#
#  Frontend containers (2026-07-26):
#    app.<domain>    → el_kheima      (staff back office / POS / KDS)
#    <domain> (apex) → marketing_site (موقع الخيمة التسويقي الجديد)
#
#  marketing_site يشتغل بدل public_site الذي أصبح legacy. public_site
#  لا يزال يعمل كـ container لكن لا يصله أي traffic مباشر من nginx بعد الآن.
#  احذفه من docker-compose.prod.yml بعد 48h من التأكد من استقرار marketing_site.
#
#  BEFORE FIRST DEPLOY — replace every `yourdomain.com` below with your real
#  domain, and see DEPLOYMENT.md §7 for the certbot flow that populates
#  /etc/letsencrypt (mounted read-only here as `certbot_certs`).
# ─────────────────────────────────────────────────────────────────────────────

# Shared ACME-challenge + HTTP→HTTPS redirect for all hostnames.
server {
    listen 80;
    server_name app.yourdomain.com yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── app.yourdomain.com → el-kheima (staff) ───────────────────────────────────
server {
    listen 443 ssl;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://el_kheima:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (KDS) passthrough
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── yourdomain.com (apex) + www → marketing_site ─────────────────────────────
server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # ── الموقع الجديد يستقبل كل شيء ────────────────────────────────────────
    # marketing_site يحتوي على:
    #   /s/:token      → QrOrder.vue     (QR طلبات الطاولات والشمسيات)
    #   /survey/:token → GuestSurvey.vue (استبيان رضا الضيف)
    #   /hub           → DigitalHub.vue  (المنيو الرقمي)
    #   / وباقي الصفحات → الموقع التسويقي الكامل
    location / {
        proxy_pass http://marketing_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
