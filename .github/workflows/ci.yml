name: CI

on:
  push:
    branches: ["main", "release/**", "claude/CX-02C-frontend-auth-bootstrap"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch: {}

# منع تشغيل وظيفتين متوازيتين على نفس الفرع — لو جاء push جديد والسابق لسه
# شغّال، يُلغى السابق ويُشغَّل الجديد.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend — unit + integration tests (SQLite in-memory) ─────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: backend

    # منفذ 6381 هنا يطابق REDIS_URL/CELERY_*_URL في backend/.env.example
    # حرفيًا — مفيش أي sed للمنفذ نفسه، غير كده هنقع في نفس باج "شغّال
    # عندي، أحمر على CI" اللي المراجعة كشفته. باقي المهام (Celery
    # notify_critical_work_order وغيرها) بتحتاج Redis حي فعليًا وقت الطلب
    # (.delay())، مش fake/eager — الـ service ده بيوفّر نفس السلوك الحقيقي.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        # poppler-utils يوفّر pdftotext — تستات إيصالات الإيجار/التايم شير
        # بتتأكد من محتوى الـPDF الفعلي بيه (مش بس إنه اتولّد)، وده مفيش
        # بديل بايثون خالص له في requirements.txt.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Prepare CI env
        # الـ tests بتشتغل بـ SQLite in-memory تلقائياً (conftest.py:34).
        # القيم دي كلها وهمية وثابتة لـCI بس — مش أسرار حقيقية، ومفيش أي
        # منها بيُستخدم على أي بيئة حقيقية. SECRET_KEY/SURVEY_TOKEN_SECRET/
        # TIMESHARE_PORTAL_TOKEN_SECRET لازم تكون ≥32 حرف وخالية من كلمات
        # زي CHANGE_ME (راجع Settings._validate_secret_key/
        # _validate_token_signing_secrets في app/core/config.py) — قيم
        # .env.example الافتراضية (CHANGE_ME_...) بتعدي بتحذير بس في test
        # (مش fail)، لكن بنستبدلها هنا بقيم نضيفة عشان تشغيل CI يبقى مطابق
        # تمامًا لتشغيل production الحقيقي بدون أي تحذير مموّه.
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^ENVIRONMENT=.*|ENVIRONMENT=test|' \
            -e 's|^SECRET_KEY=.*|SECRET_KEY=ci-test-secret-key-not-for-production-32x|' \
            -e 's|^SURVEY_TOKEN_SECRET=.*|SURVEY_TOKEN_SECRET=ci-test-survey-token-secret-not-for-prod-32x|' \
            -e 's|^TIMESHARE_PORTAL_TOKEN_SECRET=.*|TIMESHARE_PORTAL_TOKEN_SECRET=ci-test-timeshare-portal-secret-not-for-prod-32x|' \
            .env

      - name: Alembic single head
        run: |
          heads=$(.venv/bin/python -m alembic heads)
          echo "$heads"
          count=$(echo "$heads" | grep -c '(head)')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $count"
            exit 1
          fi

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --ignore=tests/test_gate4_concurrency.py \
            --ignore=tests/test_dining_paid_concurrency.py \
            --ignore=tests/test_step_up_concurrency.py \
            --ignore=tests/test_auth_refresh_concurrency.py \
            --ignore=tests/test_super_admin_concurrency.py \
            --ignore=tests/test_refresh_family_concurrency.py
        # ⚠️ اختبارات التزامن (gate4, dining_paid, step_up, auth, super_admin,
        # refresh_family) تحتاج PostgreSQL حي لاختبار behavior الـ locks
        # والـ SELECT FOR UPDATE. تُشغَّل يدوياً على staging قبل Gate 9.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7

  # ── Frontend — type-check + build ─────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript / Vue)
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (all apps)
        run: pnpm run type-check:all

      - name: Run frontend tests
        # test:frontend (مش test:unit) — بتضيف فحص تطابق مفاتيح i18n
        # عربي/إنجليزي (scripts/validate-i18n.mjs) زي بوابة الإصدار الرسمية
        # في DEPLOYMENT.md بالظبط، مش نسخة أضعف منها.
        run: pnpm --filter el-kheima run test:frontend

      - name: Build (all apps — production)
        run: pnpm run build:all
        env:
          # CI verifies the production fail-closed contract without claiming a
          # real resort domain. Deployment supplies the owner-confirmed origin.
          VITE_PUBLIC_SITE_URL: https://public.example.invalid

  # ── Docker Compose Config Validation ──────────────────────────────────────
  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-22.04
    env:
      PUBLIC_SITE_URL: https://public.example.invalid
      # docker-compose.prod.yml يفرض DB_PASSWORD إجباري (نفس السلوك في
      # الإنتاج الحقيقي — راجع scripts/deploy.sh) — قيمة وهمية هنا، الهدف
      # التحقق من صحة الـcompose config بس، مش تشغيل حاويات فعلية.
      DB_PASSWORD: ci-only-dummy-db-password-not-real

    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config --quiet
