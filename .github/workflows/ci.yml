name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

# منع تشغيل وظيفتين متوازيتين على نفس الفرع — لو جاء push جديد والسابق لسه
# شغّال، يُلغى السابق ويُشغَّل الجديد.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend — unit + integration tests (SQLite in-memory) ─────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Prepare CI env
        # الـ tests بتشتغل بـ SQLite in-memory تلقائياً (conftest.py:34).
        # نحتاج .env فقط لتهيئة الـ Settings object — SECRET_KEY لازم ≥32 char.
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^ENVIRONMENT=.*|ENVIRONMENT=test|' \
            -e 's|^SECRET_KEY=.*|SECRET_KEY=ci-test-secret-key-not-for-production-32x|' \
            .env

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --ignore=tests/test_gate4_concurrency.py \
            --ignore=tests/test_dining_paid_concurrency.py \
            --ignore=tests/test_step_up_concurrency.py \
            --ignore=tests/test_auth_refresh_concurrency.py \
            --ignore=tests/test_super_admin_concurrency.py \
            --ignore=tests/test_refresh_family_concurrency.py
        # ⚠️ اختبارات التزامن (gate4, dining_paid, step_up, auth, super_admin,
        # refresh_family) تحتاج PostgreSQL حي لاختبار behavior الـ locks
        # والـ SELECT FOR UPDATE. تُشغَّل يدوياً على staging قبل Gate 9.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7

  # ── Frontend — type-check + build ─────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript / Vue)
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (all apps)
        run: pnpm run type-check:all

      - name: Run frontend tests
        run: pnpm --filter el-kheima run test:unit

      - name: Build (all apps — production)
        run: pnpm run build:all

  # ── Docker Compose Config Validation ──────────────────────────────────────
  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config --quiet
