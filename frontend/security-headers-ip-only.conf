# نسخة مؤقتة من security-headers.conf، خاصة بالنشر التجريبي بالـIP بدون TLS
# (docker-compose.prod.ip-only.yml). الفرق الوحيد: من غير `upgrade-insecure-
# requests` في الـCSP.
#
# ⚠️ باج حقيقي كان هنا (اتصلح 2026-08-29): `upgrade-insecure-requests` بيقول
# للمتصفح "حوّل أي طلب أصول (CSS/JS/صور) لـHTTPS إجباريًا حتى لو الصفحة نفسها
# HTTP" — صح تمامًا في الإنتاج الحقيقي (دومين + TLS)، لكن قاتل لأي نشر HTTP-
# فقط زي ده (مفيش TLS على البورتات دي أصلاً) — كل أصول الصفحة كانت بترجع
# net::ERR_SSL_PROTOCOL_ERROR فورًا، والصفحة بتفضل بيضا بالكامل. راجع
# frontend/Dockerfile's SECURITY_HEADERS_FILE build-arg وdocker-compose.
# prod.ip-only.yml لمكان الاستخدام.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; manifest-src 'self'; worker-src 'self' blob:" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
