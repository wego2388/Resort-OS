<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Cairo — self-hosted woff2 (Gate 9: no external network dependency).
    Fonts downloaded from Google Fonts 2026-07-25 and stored in /fonts/.
    font-display:swap في fonts.css — المتصفح يعرض بـ system fallback فورًا
    ويحوّل لـ Cairo بعد تحميله، بدون أي blocking.
  -->
  <link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <title>Resort OS</title>
</head>
<body class="bg-resort-bg font-sans">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
