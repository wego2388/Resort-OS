# ─────────────────────────────────────────────────────────────────────────────
#  Domain-based TLS override — elkheima.com
#
#  يستبدل edge-ip-tls.conf بعد انتشار الـ DNS.
#  كل الـ subdomains على port 443 (مش 8443).
#
#  Usage:
#    docker compose -f docker-compose.prod.yml \
#      -f docker-compose.prod.domain.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    environment:
      PUBLIC_SITE_URL: https://elkheima.com
      CORS_ORIGINS: https://elkheima.com,https://www.elkheima.com,https://app.elkheima.com,https://owner.elkheima.com
      CHAT_PUBLIC_HOST_BRANCH_MAP: '{"elkheima.com":1,"www.elkheima.com":1}'

  celery_worker:
    environment:
      PUBLIC_SITE_URL: https://elkheima.com

  celery_beat:
    environment:
      PUBLIC_SITE_URL: https://elkheima.com

  el_kheima:
    build:
      args:
        VITE_PUBLIC_SITE_URL: https://elkheima.com

  marketing_site:
    build:
      args:
        VITE_PUBLIC_SITE_URL: https://elkheima.com
        VITE_CHATBOT_ENABLED: "true"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/edge-domain.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/owner.conf:/etc/nginx/conf.d/owner.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
